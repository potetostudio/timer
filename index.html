<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="シンプルな時間計測タイマー" />
    <title>Simple Timer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="timer-app" aria-live="polite">
      <section class="timer-card" aria-label="タイマー">
        <p class="label">時間</p>
        <div id="display" class="display" aria-live="polite">00:00:00.0</div>

        <div class="controls">
          <button id="startPauseBtn" class="primary" type="button">開始</button>
          <button id="resetBtn" class="secondary" type="button">リセット</button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
